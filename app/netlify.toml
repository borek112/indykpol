[build]
  command = "npm install && npm run build && npm run seed:demo"
  publish = "dist/public"
  functions = "netlify/functions"

[[redirects]]
  from = "/.netlify/functions/trpc/*"
  to = "/.netlify/functions/trpc/:splat"
  status = 200

[[redirects]]
  from = "/api/trpc/*"
  to = "/.netlify/functions/trpc/:splat"
  status = 200

[[redirects]]
  from = "/api/demo-login"
  to = "/.netlify/functions/demo-login"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
