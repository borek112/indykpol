# Netlify configuration for the monorepo root.
# The deployable frontend lives in ./app.

[build]
  base = "app"
  command = "npm install --legacy-peer-deps && npx vite build"
  publish = "dist/public"

[[redirects]]
  from = "/api/*"
  to = "https://indykpol-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
