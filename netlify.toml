# Netlify configuration for the monorepo root.
# The deployable frontend lives in ./app.

[build]
  base = "app"
  command = "npm install --legacy-peer-deps && npx vite build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"
  VITE_DEMO_MODE = "true"

[[redirects]]
  from = "/api/*"
  to = "https://indykpol-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
