# Netlify configuration for the monorepo root.
# The deployable frontend lives in ./app.

[build]
  base = "app"
  command = "npm install --legacy-peer-deps && npx vite build"
  publish = "dist/public"

[functions]
  directory = "app/netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/trpc/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/trpc/health"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
