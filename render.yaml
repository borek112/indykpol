services:
  - type: web
    name: indykpol-api
    runtime: docker
    branch: main
    rootDir: app
    dockerfilePath: ./Dockerfile.production
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_COMPANY_ID
        value: "1"
      - key: FRONTEND_URL
        value: https://indykpol-demo.netlify.app
      - key: CORS_ORIGIN
        value: https://indykpol-demo.netlify.app
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: UPLOAD_DIR
        value: /data/uploads
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1
